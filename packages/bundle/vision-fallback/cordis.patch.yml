# Optional automatic image recognition. The provider stays dormant until the
# user selects a native visual provider/model in Settings → Plugins → Automatic vision.

- insert:
    - id: llm-vision-fallback
      name: '@deepseek-ai/dsh-llm-vision-fallback'

    # The client module scanner discovers dsh.client declarations from enabled
    # Loader rows, so the browser-only companion keeps its own inert Host row.
    - id: ui-settings-vision-fallback
      name: '@deepseek-ai/dsh-client-ui-settings-vision-fallback'
